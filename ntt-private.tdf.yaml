apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: ntt-private
  version: "1.3.0"
  displayName: NTT prep cluster - RKE2 amd64 (Oct 2026)
  description: >
    NTT demo prep cluster (refreshed Oct 2026). RKE2, amd64. 48 GB RAM,
    12 CPU cores, 400 GB storage. Two namespaces: ntt-tenant-a, ntt-tenant-b.
    Network policy: same-namespace allowed, cross-tenant denied.
    Deploy into namespace ntt-tenant-a. Rancher UI is the operator console.
    Workload access is the kube API with the tenant-a kubeconfig.
    Pods labeled app=data-science may egress TCP 443. That allow covers
    Vertex Gemini and BigQuery. Non-443 egress stays closed.
  tags:
    provider: ntt
    geo: us
    tier: private
target:
  provider: kubernetes
  regions:
    - ntt-lab
  geography:
    continent: na
    country: us
    metro: ntt-lab
  networking:
    defaultNetworkPolicy: private
    sameNamespace: allow
    crossNamespace: deny
    egress:
      dns: kube-system:53
      sameNamespace: allow
      googleApi: allow
      googleApiPort: 443
      googleApiSelector: app=data-science
  services:
    - name: ntt-k8s
      type: kubernetes
      providerService: RKE2
      endpoints:
        kubeApi: https://151.185.34.22:6443
        rancherUi: https://rancher.151.185.34.22.sslip.io/
      capabilities:
        accessMode: kubeconfig
        supportsDirectKubeApi: true
        supportsNamespaceTenant: true
        arch: amd64
        kubernetesVersion: v1.32.13+rke2r1
      defaults:
        namespace: ntt-tenant-a
        storageClass: longhorn
        ingressClass: nginx
    - name: vertex-ai
      type: ml-platform
      providerService: Vertex AI (Gemini)
      endpoints:
        api: https://us-central1-aiplatform.googleapis.com
      capabilities:
        sherpaDeploysModel: false
        model: gemini-2.5-flash
    - name: bigquery
      type: database
      providerService: BigQuery
      endpoints:
        api: https://bigquery.googleapis.com
    - name: postgres-acme
      type: database
      providerService: PostgreSQL
      defaults:
        namespace: ntt-tenant-a
        service: postgres-acme.ntt-tenant-a.svc
        port: 5432
        database: acme
    - name: neo4j
      type: database
      providerService: Neo4j
      defaults:
        namespace: ntt-tenant-a
        service: neo4j.ntt-tenant-a.svc
        boltPort: 7687
    - name: ntt-secrets
      type: secrets
      providerService: Kubernetes Secrets
      defaults:
        namespace: ntt-tenant-a
  infrastructure:
    clusters:
      - name: ntt-demo-prep
        service: ntt-k8s
        arch: amd64
        storage: 400Gi
        totalResources:
          cpu: 12
          memoryGi: 48
          storageGi: 400
    secretStores:
      - name: ntt-tenant-a-secrets
        service: ntt-secrets
  credentialProfiles:
    - name: tenant-a-kubeconfig
      source: internal_vault
      required: true
      kind: kubeconfig
      ref: ntt-demo-prep-tenant-a
      fields:
        namespace: ntt-tenant-a
    - name: gcp
      source: internal_vault
      required: true
      kind: service_account
      ref: gcp-sa-key-json
      fields:
        project: gcp-secret-manager-project-id
