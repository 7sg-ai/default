apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: gcp-native
  version: "1.4.0"
  displayName: GCP US Central - Cloud Run + GKE Neo4j + Vertex AI + BigQuery + Spanner
  description: >
    GCP target for the Data Science agent. Cloud Run hosts the application.
    Vertex AI serves Gemini. BigQuery is the warehouse. Spanner Graph remains
    available. Scenario native-neo4j uses a managed Neo4j on the shared GKE
    cluster data-science-neo4j. Cloud Run reaches Bolt on the reserved
    internal address through Direct VPC egress. Teardown removes the Helm
    release and does not delete the cluster.
  tags:
    provider: gcp
    geo: us
    tier: native
target:
  provider: gcp
  regions:
    - us-central1
  geography:
    continent: na
    country: us
    metro: iowa
  networking:
    defaultNetworkPolicy: public
  services:
    - name: cloud-run
      type: serverless
      providerService: Cloud Run
      defaults:
        namespace: default
      capabilities:
        supportsOIDCWorkloadIdentity: true
        supportsPrivateEndpoints: true
      quotas:
        maxCPUCores: 8
        maxMemoryGiB: 32
    - name: vertex-ai
      type: ml-platform
      providerService: Vertex AI (Gemini)
      endpoints:
        api: https://us-central1-aiplatform.googleapis.com
      capabilities:
        supportsOIDCWorkloadIdentity: true
      availability:
        slaTier: standard
        supportedRegions:
          - us-central1
          - us-east1
          - europe-west1
    - name: bigquery
      type: database
      providerService: BigQuery
      endpoints:
        api: https://bigquery.googleapis.com
      capabilities:
        supportsPrivateEndpoints: true
    - name: spanner
      type: database
      providerService: Cloud Spanner
      capabilities:
        supportsPrivateEndpoints: true
        graphEngine: spanner-graph
        supportsPropertyGraph: true
    - name: gke
      type: kubernetes
      providerService: GKE
      endpoints:
        cluster: data-science-neo4j
      defaults:
        namespace: neo4j
        region: us-central1
        zone: us-central1-a
        network: default
        subnet: default
      capabilities:
        nodeMachineType: e2-standard-2
        supportsPrivateEndpoints: true
    - name: neo4j
      type: database
      providerService: Neo4j
      endpoints:
        bolt: bolt://10.128.0.4:7687
      defaults:
        namespace: neo4j
        release: neo4j
        cluster: data-science-neo4j
        boltPort: 7687
      capabilities:
        graphEngine: neo4j
        supportsPropertyGraph: true
        chart: neo4j/neo4j
        chartVersion: "5.26.1"
        storageClass: standard-rwo
    - name: secret-manager
      type: secrets
      providerService: Secret Manager
      capabilities:
        supportsPrivateEndpoints: true
    - name: artifact-registry
      type: custom
      providerService: Artifact Registry
      defaults:
        repository: data-science
      endpoints:
        registry: us-central1-docker.pkg.dev
    - name: cloud-logging
      type: observability
      providerService: Cloud Logging + Cloud Monitoring
    - name: iam
      type: identity
      providerService: IAM + Workload Identity
  infrastructure:
    clusters:
      - name: data-science-neo4j
        service: gke
        provider: gcp
        location: us-central1-a
        network: default
        subnet: default
        purpose: neo4j
        shared: true
        nodes:
          - name: data-science-neo4j-pool
            machineType: e2-standard-2
            count: 1
    secretStores:
      - name: gcp-main
        service: secret-manager
  credentialProfiles:
    - name: gcp
      source: internal_vault
      required: true
      kind: service_account
      ref: gcp-sa-key-json
      fields:
        project: gcp-secret-manager-project-id
    - name: gcp-registry
      source: internal_vault
      required: false
      purpose: registry
      kind: service_account
      ref: gcp-sa-key-json
