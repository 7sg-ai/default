apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: neo4j-graph-gcp
  version: "0.1.0"
  tags:
    env: dev
    role: graph
home:
  tdfRef: gcp-native
connection:
  type: database
  provider: neo4j
  database: neo4j
  capabilities:
    graphEngine: neo4j
    excelLoader: false
auth:
  method: password
  secretRefs:
    - neo4j-password
provisioning:
  supportedModes:
    - managed
  defaultMode: managed
  provisioner:
    type: repository-script
    protocolVersion: "1"
    runtime: python3
    path: infra/gcp/neo4j/provision.py
  parameters:
    zone: us-central1-a
    clusterName: data-science-neo4j
    namespace: neo4j
    releaseName: neo4j
    loadBalancerIp: "10.128.0.20"
    storageGb: 20
    chartVersion: "5.26.1"
  outputs:
    NEO4J_URI: environment.NEO4J_URI
    NEO4J_USER: environment.NEO4J_USER
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
notes:
  - >
    Neo4j runs in a GKE cluster on the default VPC. Cloud Run reaches it over
    Bolt on a reserved internal load balancer address, so nothing is exposed
    to the internet. The password is the neo4j-password secret that the WDF
    declares; the provisioner reads it from Secret Manager and never prints
    it. loadBalancerIp is the address printed by create_neo4j_cluster.sh.
