apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: spanner-graph-gcp
  version: "1.1.0"
  tags:
    env: prod
    role: graph
home:
  tdfRef: gcp-native
connection:
  type: database
  provider: gcp-spanner
  resource: projects/gen-lang-client-0373235205/instances/data-science/databases/workbook_graph
  project: gen-lang-client-0373235205
  instance: data-science
  database: workbook_graph
  capabilities:
    graphEngine: spanner-graph
    supportsPropertyGraph: true
    excelLoader: true
auth:
  method: gcp-workload-identity
  secretRefs: []
provisioning:
  supportedModes:
    - existing
    - managed
  defaultMode: existing
  provisioner:
    type: repository-script
    protocolVersion: "1"
    runtime: python3
    path: infra/gcp/spanner/provision.py
  parameters:
    region: us-central1
    instanceId: data-science
    databaseId: workbook_graph
    processingUnits: 100
  outputs:
    SPANNER_PROJECT_ID: environment.SPANNER_PROJECT_ID
    SPANNER_INSTANCE_ID: environment.SPANNER_INSTANCE_ID
    SPANNER_DATABASE_ID: environment.SPANNER_DATABASE_ID
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs: []
notes:
  - >
    Cloud Run uses its attached service account through Application Default
    Credentials. The runtime identity needs Spanner session, data read/write,
    and database DDL permissions because workbook loading creates tables and
    property graphs.
