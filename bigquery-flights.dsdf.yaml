apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: bigquery-flights
  version: "1.2.0"
  tags:
    env: prod
home:
  tdfRef: gcp-native
connection:
  type: warehouse
  provider: gcp-bigquery
  resource: cymbal_flights_dataset
  capabilities:
    supportsCrossDatasetJoins: true
    supportsMcpToolbox: false
    builtinAdkTool: true
auth:
  method: gcp-workload-identity
  secretRefs:
    - bq-data-project-id
provisioning:
  supportedModes:
    - existing
    - managed
  defaultMode: existing
  provisioner:
    type: repository-script
    protocolVersion: "1"
    runtime: python3
    path: infra/gcp/bigquery/provision.py
  parameters:
    location: us-central1
    datasetId: cymbal_flights_dataset
    billingModel: on-demand
    seedTables:
      - table: flight_history
        file: flights_dataset/flight_history_table.csv
      - table: cymbalair_policies
        file: flights_dataset/cymbalair_policies_table.csv
        allowQuotedNewlines: true
      - table: ticket_sales_history
        file: flights_dataset/ticket_sales_history_table.csv
  outputs:
    BQ_DATASET_ID: environment.BQ_DATASET_ID
secrets:
  provider: gcpSecretManager
  inheritFromWdf: true
  secretRefs:
    - name: bq-data-project-id
      injectAs: env
      envVar: BQ_DATA_PROJECT_ID
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: bq-data-project-id
    - name: bq-compute-project-id
      injectAs: env
      envVar: BQ_COMPUTE_PROJECT_ID
      externalRef:
        provider: gcp-secret-manager
        vaultRef: gcp-main
        key: bq-compute-project-id
