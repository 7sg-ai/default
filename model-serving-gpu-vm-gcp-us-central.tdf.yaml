apiVersion: tdf.7sg.ai/v1
kind: TargetDefinition
metadata:
  name: model-serving-gpu-vm-gcp-us-central
  version: "1.0.6"
  displayName: GCP US Central - GPU VM (single-host, Docker Compose)
  description: >
    Pre-provisioned GCP GPU VM target for the 7sg-ai/model-serving apps.
    A single GPU VM (Docker + NVIDIA Container Toolkit) hosts an app
    container and its NIM sidecar via Docker Compose over SSH.
    Host prerequisite: proprietary NVIDIA driver 610.57.04 MUST already
    be loaded (open 615 hangs CUDA). Deploy gates with nvidia-smi + a
    CUDA_OK matmul; it never apt-installs or replaces the driver.
    Apply is compose-on-host (no Cloud Run). Artifact Registry may exist
    on the project but is optional and unused for this apply path.
    Workload-agnostic: the app URL/port belongs in the WDF, not here.
  tags:
    provider: gcp
    geo: us
    tier: gpu-vm
target:
  provider: gcp
  regions:
    - us-central1
  geography:
    continent: na
    country: us
    metro: iowa
  networking:
    defaultNetworkPolicy: public
  services:
    - name: gpu-vm
      type: custom
      providerService: GCE GPU VM (single host)
      endpoints:
        ssh: ubuntu@136.113.88.57
      capabilities:
        supportsSSH: true
        supportsDockerCompose: true
        supportsGPUContainers: true
        gpuTypes:
          - nvidia-a100-40gb
      quotas:
        maxGPUs: 1
        maxCPUCores: 12
        maxMemoryGiB: 83
      availability:
        slaTier: best-effort
    - name: docker
      type: custom
      providerService: Docker Engine + NVIDIA Container Toolkit
      capabilities:
        supportsGPUContainers: true
        supportsCompose: true
    - name: artifact-registry
      type: container-registry
      providerService: Artifact Registry
      endpoints:
        registry: us-central1-docker.pkg.dev
    - name: secret-manager
      type: secrets
      providerService: Secret Manager
      capabilities:
        supportsPrivateEndpoints: true
    - name: cloud-logging
      type: observability
      providerService: Cloud Logging + Cloud Monitoring
    - name: iam
      type: identity
      providerService: IAM + Workload Identity
  infrastructure:
    clusters: []
    hosts:
      - name: gpu-vm-0
        service: gpu-vm
        endpoint: ubuntu@136.113.88.57
        user: ubuntu
        sshKeyRef: ssh          # references credentialProfiles[].name: ssh (external GCP Secret Manager)
        gpuCount: 1
        driverPrerequisite: proprietary-nvidia-610.57.04
        cudaOkRequired: true
        neverInstallDriver: true
    secretStores:
      - name: gcp-secret-manager
        service: secret-manager
  credentialProfiles:
    - name: gcp
      source: internal_vault
      required: true
      kind: service_account
      ref: gcp-sa-key-json
      fields:
        project: gcp-secret-manager-project-id
    - name: ssh
      source: external_vault
      required: true
      purpose: vm-access
      kind: ssh_key
      ref: model-serving-gpu-vm-ssh-key
      fields:
        user: ubuntu
        host: 136.113.88.57
        store: gcp-secret-manager
        key: model-serving-gpu-vm-ssh-key
        project: gen-lang-client-0373235205
    - name: gcp-registry
      source: internal_vault
      required: false
      purpose: registry
      kind: service_account
      ref: gcp-sa-key-json
