apiVersion: dsdf.7sg.ai/v1
kind: DataSourceDefinition
metadata:
  name: postgres-acme
  version: "1.0.1"
  tags:
    env: prod
    role: workbook
home:
  tdfRef: ntt-private
connection:
  type: database
  provider: postgres
  resource: acme
  host: postgres-acme.ntt-tenant-a.svc
  port: 5432
  user: acme
  capabilities:
    loadOnDeploy: true
    sourceFile: sample_data/Acme Corp Financial Model.xlsx
auth:
  method: password
  secretRefs:
    - postgres-acme-password
secrets:
  provider: inherit
  inheritFromWdf: true
  secretRefs:
    - name: postgres-acme-password
      injectAs: env
      envVar: POSTGRES_PASSWORD
      source_type: internal_value
      internalRef: postgres-acme-password
notes:
  - >
    The password is stored in the internal vault as postgres-acme-password
    and in the Kubernetes secret postgres-acme-password in ntt-tenant-a.
    A deploy Job loads sample_data/Acme Corp Financial Model.xlsx. The agent
    does not open that folder at startup.
